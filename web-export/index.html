<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta
		name="viewport"
		content="width=device-width, user-scalable=no, initial-scale=1.0"
	>

	<title>Super Sam</title>

	<style>
		html,
		body,
		#canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			color: white;
			background-color: black;
			overflow: hidden;
			touch-action: none;
		}

		#canvas {
			display: block;
		}

		#canvas:focus {
			outline: none;
		}

		/* --------------------------------------------------
		   GODOT STATUS / LOADING SCREEN
		   -------------------------------------------------- */

		#status,
		#status-splash,
		#status-progress {
			position: absolute;
			left: 0;
			right: 0;
		}

		#status,
		#status-splash {
			top: 0;
			bottom: 0;
		}

		#status {
			background-color: #242424;

			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;

			visibility: hidden;
		}

		#status-splash {
			max-height: 100%;
			max-width: 100%;
			margin: auto;
		}

		#status-splash.show-image--false {
			display: none;
		}

		#status-splash.fullsize--true {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		#status-splash.use-filter--false {
			image-rendering: pixelated;
		}

		#status-progress,
		#status-notice {
			display: none;
		}

		#status-progress {
			bottom: 10%;
			width: 50%;
			margin: 0 auto;
		}

		#status-notice {
			z-index: 1;

			margin: 0 2rem;
			padding: 1rem;

			color: #e0e0e0;
			background-color: #5b3943;

			border: 1px solid #9b3943;
			border-radius: 0.5rem;

			font-family: "Noto Sans", "Droid Sans", Arial, sans-serif;
			line-height: 1.3;
			text-align: center;

			overflow: hidden;
		}

		/* --------------------------------------------------
		   BACK TO GAMES
		   -------------------------------------------------- */

		.back-to-games {
			position: fixed;
			z-index: 9999;

			padding: 10px 14px;

			color: #75f4ff;
			background: rgba(8, 6, 17, 0.85);

			border: 2px solid #75f4ff;

			font-family: monospace;
			font-size: 12px;
			text-decoration: none;

			box-shadow: 3px 3px 0 #155b67;
		}

		.back-to-games:hover {
			color: #080611;
			background: #75f4ff;
		}

		.fullscreen-button {
	position: fixed;
	z-index: 9999;

	width: 34px;
	height: 34px;
	padding: 0;

	color: #75f4ff;
	background: rgba(8, 6, 17, 0.85);
	border: 2px solid #75f4ff;

	font-family: monospace;
	font-size: 18px;
	line-height: 1;

	box-shadow: 3px 3px 0 #155b67;
	cursor: pointer;
}

.fullscreen-button:hover {
	color: #080611;
	background: #75f4ff;
}

@media (pointer: coarse) {
	.fullscreen-button {
		width: 26px;
		height: 26px;

		font-size: 14px;

		border-width: 1px;
		box-shadow: 1px 1px 0 #155b67;
	}
}

		/* --------------------------------------------------
		   MOBILE
		   -------------------------------------------------- */

		@media (pointer: coarse) {
			.back-to-games {
				padding: 4px 6px;

				font-size: 8px;

				border-width: 1px;
				box-shadow: 1px 1px 0 #155b67;
			}
		}

		/* --------------------------------------------------
		   PORTRAIT WARNING
		   -------------------------------------------------- */

		.rotate-device {
			display: none;
		}

		@media (orientation: portrait) and (pointer: coarse) {
			.rotate-device {
				position: fixed;
				inset: 0;
				z-index: 9998;

				display: flex;
				align-items: center;
				justify-content: center;

				padding: 2rem;

				color: #75f4ff;
				background: #080611;

				font-family: monospace;
				font-size: 16px;
				line-height: 1.8;
				text-align: center;
			}

			.rotate-device p {
				margin: 0.7rem 0;
			}

			.rotate-device p:first-child {
				font-size: 40px;
				color: #ff7acb;
			}
		}
	</style>

	<link
		id="-gd-engine-icon"
		rel="icon"
		type="image/png"
		href="index.icon.png"
	>

	<link
		rel="apple-touch-icon"
		href="index.apple-touch-icon.png"
	>
</head>

<body>

	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>


	<!-- GODOT LOADING / ERROR SCREEN -->

	<div id="status">
		<img
			id="status-splash"
			class="show-image--true fullsize--true use-filter--true"
			src="index.png"
			alt=""
		>

		<progress id="status-progress"></progress>

		<div id="status-notice"></div>
	</div>


	<!-- BACK BUTTON -->

	<a href="/games/" class="back-to-games">
		← BACK TO GAMES
	</a>

	<button
	class="fullscreen-button"
	type="button"
	aria-label="Fullscreen"
	title="Fullscreen"
>
	⛶
</button>


	<!-- ROTATE PHONE MESSAGE -->

	<div class="rotate-device">
		<div>
			<p>↻</p>
			<p>PLEASE ROTATE YOUR DEVICE</p>
			<p>LANDSCAPE MODE REQUIRED</p>
		</div>
	</div>


	<!-- GODOT -->

	<script src="index.js"></script>

	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9451052,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;

		const engine = new Engine(GODOT_CONFIG);

		(function () {

			const statusOverlay =
				document.getElementById("status");

			const statusProgress =
				document.getElementById("status-progress");

			const statusNotice =
				document.getElementById("status-notice");


			let initializing = true;
			let statusMode = "";


			function setStatusMode(mode) {

				if (
					statusMode === mode ||
					!initializing
				) {
					return;
				}


				if (mode === "hidden") {
					statusOverlay.remove();

					initializing = false;

					return;
				}


				statusOverlay.style.visibility =
					"visible";


				statusProgress.style.display =
					mode === "progress"
						? "block"
						: "none";


				statusNotice.style.display =
					mode === "notice"
						? "block"
						: "none";


				statusMode = mode;
			}


			function setStatusNotice(text) {

				while (statusNotice.lastChild) {
					statusNotice.removeChild(
						statusNotice.lastChild
					);
				}


				const lines =
					text.split("\n");


				lines.forEach((line) => {

					statusNotice.appendChild(
						document.createTextNode(line)
					);

					statusNotice.appendChild(
						document.createElement("br")
					);

				});
			}


			function displayFailureNotice(err) {

				console.error(err);


				if (err instanceof Error) {

					setStatusNotice(err.message);

				} else if (typeof err === "string") {

					setStatusNotice(err);

				} else {

					setStatusNotice(
						"An unknown error occurred."
					);

				}


				setStatusMode("notice");

				initializing = false;
			}


			const missing =
				Engine.getMissingFeatures({
					threads: GODOT_THREADS_ENABLED,
				});


			if (missing.length !== 0) {

				if (
					GODOT_CONFIG["serviceWorker"] &&
					GODOT_CONFIG[
						"ensureCrossOriginIsolationHeaders"
					] &&
					"serviceWorker" in navigator
				) {

					let serviceWorkerRegistrationPromise;


					try {

						serviceWorkerRegistrationPromise =
							navigator.serviceWorker
								.getRegistration();

					} catch (err) {

						serviceWorkerRegistrationPromise =
							Promise.reject(
								new Error(
									"Service worker registration failed."
								)
							);

					}


					Promise.race([

						serviceWorkerRegistrationPromise

							.then((registration) => {

								if (registration != null) {

									return Promise.reject(
										new Error(
											"Service worker already exists."
										)
									);

								}

								return registration;
							})

							.then(() =>
								engine.installServiceWorker()
							),


						new Promise((resolve) => {

							setTimeout(
								() => resolve(),
								2000
							);

						}),

					])

						.then(() => {

							window.location.reload();

						})

						.catch((err) => {

							console.error(
								"Error while registering service worker:",
								err
							);

						});

				} else {

					const missingMsg =
						"Error\n" +
						"The following features required " +
						"to run Godot projects on the Web " +
						"are missing:\n";


					displayFailureNotice(
						missingMsg +
						missing.join("\n")
					);
				}

			} else {

				setStatusMode("progress");


				engine.startGame({

					onProgress:
						function (current, total) {

							if (
								current > 0 &&
								total > 0
							) {

								statusProgress.value =
									current;

								statusProgress.max =
									total;

							} else {

								statusProgress
									.removeAttribute(
										"value"
									);

								statusProgress
									.removeAttribute(
										"max"
									);
							}
						},

				}).then(

					() => {
						setStatusMode("hidden");
					},

					displayFailureNotice
				);
			}

		}());
	</script>


	<!--
		Position the BACK button relative to the
		actual visible Super Sam game area.

		Super Sam:
		480 × 270 = 16:9
	-->

	<script>
		(() => {

			const backButtonElement =
				document.querySelector(
					".back-to-games"
				);

			const fullscreenButtonElement =
				document.querySelector(".fullscreen-button");

			const gameCanvasElement =
				document.getElementById(
					"canvas"
				);


			if (
				!backButtonElement ||
				!gameCanvasElement
			) {
				return;
			}


			function updateBackButtonPosition() {
				const rect =
					gameCanvasElement.getBoundingClientRect();

				// Super Sam: 480 × 270 = 16:9
				const gameAspect = 16 / 9;
				const canvasAspect = rect.width / rect.height;

				let gameLeft = rect.left;
				let gameTop = rect.top;
				let gameWidth = rect.width;
				let gameHeight = rect.height;

				if (canvasAspect > gameAspect) {
					// Schwarze Balken links und rechts
					gameWidth = rect.height * gameAspect;

					const sideBarWidth =
						(rect.width - gameWidth) / 2;

					gameLeft += sideBarWidth;
				}

				if (canvasAspect < gameAspect) {
					// Schwarze Balken oben und unten
					gameHeight = rect.width / gameAspect;

					const topBarHeight =
						(rect.height - gameHeight) / 2;

					gameTop += topBarHeight;
				}

				// BACK TO GAMES links oben
				backButtonElement.style.left = "6px";

				backButtonElement.style.top =
					`${gameTop + 12}px`;

				// FULLSCREEN rechts oben
				// FULLSCREEN rechts oben
				if (fullscreenButtonElement) {
					fullscreenButtonElement.style.left = "auto";
					fullscreenButtonElement.style.right = "8px";

					fullscreenButtonElement.style.top =
						`${gameTop + 12}px`;
				}
			}


			function schedulePositionUpdate() {

				requestAnimationFrame(
					updateBackButtonPosition
				);

			}


			window.addEventListener(
				"load",
				schedulePositionUpdate
			);


			window.addEventListener(
				"resize",
				schedulePositionUpdate
			);


			window.addEventListener(
				"orientationchange",
				schedulePositionUpdate
			);


			const resizeObserver =
				new ResizeObserver(
					schedulePositionUpdate
				);


			resizeObserver.observe(
				gameCanvasElement
			);


			/*
				Godot may resize the canvas
				after the page has loaded.
			*/

			setTimeout(
				updateBackButtonPosition,
				100
			);

			setTimeout(
				updateBackButtonPosition,
				500
			);

			setTimeout(
				updateBackButtonPosition,
				1000
			);

		})();
	</script>

	<script>
(() => {
	const fullscreenButton =
		document.querySelector(".fullscreen-button");

	if (!fullscreenButton) {
		return;
	}

	fullscreenButton.addEventListener("click", async () => {
		try {
			if (!document.fullscreenElement) {
				await document.documentElement.requestFullscreen();
			} else {
				await document.exitFullscreen();
			}
		} catch (error) {
			console.error("Fullscreen failed:", error);
		}
	});

	document.addEventListener("fullscreenchange", () => {
		fullscreenButton.textContent =
			document.fullscreenElement ? "↙" : "⛶";

		fullscreenButton.title =
			document.fullscreenElement
				? "Exit fullscreen"
				: "Fullscreen";
	});
})();
</script>

</body>
</html>
